<section id="contact" class="section contact">
  <div class="container contact-inner">
    <p class="section-label centered"><span>04.</span> get in touch</p>
    <h2 class="contact-title">Let's build something.</h2>
    <p class="contact-desc">
      My inbox is open — whether it's a job opportunity, collaboration,
      or just a quick hello, I'll get back to you.
    </p>

    <a class="btn btn-primary contact-btn" [href]="'mailto:' + email">
      say hello
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
    </a>

    <p class="contact-email">{{ email }}</p>
  </div>

  <footer class="footer">
    <div class="container footer-inner">
      <p class="footer-copy">© {{ year }} Velan J — built with Angular.</p>
      <div class="footer-links">
        <a href="https://github.com/velan-11" target="_blank" rel="noopener" aria-label="GitHub">

        </a>
        <a href="https://www.linkedin.com/in/velan-j-0041621b1" target="_blank" rel="noopener" aria-label="LinkedIn">
