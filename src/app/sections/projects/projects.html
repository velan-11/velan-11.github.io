<section id="work" class="section projects">
  <div class="container">
    <p class="section-label"><span>03.</span> selected work</p>
    <h2 class="section-title">Things I've built.</h2>

    <div class="proj-grid">
      @for (p of projects; track p.title) {
        <article class="proj-card" [class.featured]="p.featured">
          <header class="proj-head">
            <div class="proj-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 7h7l2 3h11v10H2z"/>
              </svg>
            </div>
            <div class="proj-links">
              @if (p.github) {
                <a [href]="p.github" target="_blank" rel="noopener" aria-label="GitHub repo">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 .5A12 12 0 0 0 .5 12.6c0 5.3 3.4 9.8 8.2 11.4.6.1.8-.3.8-.6v-2.1c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.8.1-.8 1.2.1 1.9 1.3 1.9 1.3 1.1 1.9 2.9 1.4 3.6 1 .1-.8.4-1.4.8-1.7-2.7-.3-5.5-1.4-5.5-6 0-1.3.5-2.4 1.2-3.3-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.3a11.4 11.4 0 0 1 6 0c2.3-1.6 3.3-1.3 3.3-1.3.7 1.7.2 2.9.1 3.2.8.9 1.2 2 1.2 3.3 0 4.7-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.3v3.4c0 .3.2.7.8.6A12 12 0 0 0 23.5 12.6 12 12 0 0 0 12 .5z"/></svg>
                </a>
              }
              @if (p.live) {
                <a [href]="p.live" target="_blank" rel="noopener" aria-label="Live demo">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14L21 3M21 3h-7m7 0v7M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
                </a>
              }
            </div>
          </header>

          <h3 class="proj-title">{{ p.title }}</h3>
          <p class="proj-blurb">{{ p.blurb }}</p>
          <p class="proj-desc">{{ p.description }}</p>

          <ul class="stack-list" aria-label="Tech stack">
            @for (t of p.stack; track t) {
              <li>{{ t }}</li>
            }
          </ul>
        </article>
      }
    </div>
  </div>
</section>
